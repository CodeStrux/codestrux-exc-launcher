[package]
name = "exc-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, lightweight terminal menu launcher for automating everyday commands and project-specific tasks"
license = "MIT"
repository = "https://github.com/codestrux/codestrux-exc-launcher"
readme = "README.md"
keywords = ["cli", "launcher", "terminal", "tui", "menu"]
categories = ["command-line-utilities"]
# Belt-and-suspenders on top of .gitignore: `cargo package` falls back to
# packaging every file in the working directory (ignored ones included) when
# there's no git commit history to diff against, so these must be excluded
# here explicitly too. `local/` in particular holds real hosts/VPN certs used
# for day-to-day dev testing and must never end up in a published crate.
exclude = ["/local", "/qodana.yaml", "/resume", "/.idea"]

[[bin]]
name = "exc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_mangen = "0.3.3"
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
regex = "1.13.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
thiserror = "2.0.20"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
